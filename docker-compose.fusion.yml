# FILE: docker-compose.fusion.yml
# DESCRIPTION: Orchestrateur du produit fusionné BOS Light + moteur BIM.
#              Ne remplace PAS docker-compose.yml (qui reste utilisable pour du
#              dev isolé de BOS Light seul) : c'est le fichier à utiliser pour
#              lancer l'application complète, gateway BOS Light en unique point
#              d'entrée public côté backend.
#
#              Le backend BIM (validation IFC, ingestion graphe) vit désormais
#              dans ./bim_validator, DANS ce repo (rapatrié depuis le projet
#              d'origine MVP-bim-integration, qui n'était pas versionné) :
#              un simple `git clone` + `docker compose up` suffit, plus besoin
#              d'un dossier externe ni d'un transfert de fichiers à part.
#
# SÉCURITÉ :
#   - bim_api / timeseries_api (MVP BIM) n'ont AUCUN port publié sur l'hôte :
#     ils ne sont atteignables que via le réseau Docker interne, donc via les
#     routes /api/bim/* de l'API Gateway (bim_proxy.py), qui applique le RBAC
#     Keycloak (Administrateur/Configurateur) comme le reste de l'API.
#   - Les interfaces d'administration (ArcadeDB Studio, NATS monitoring,
#     SeaweedFS master) sont liées à 127.0.0.1 : accessibles depuis la machine
#     hôte pour le debug, pas depuis le reste du réseau local.
#   - Tous les secrets (mots de passe DB/ArcadeDB/NATS/Keycloak) viennent de
#     ./.env (gitignored) — voir .env.example. Aucune valeur par défaut n'est
#     fournie ici pour les mots de passe : docker compose échoue explicitement
#     si .env est absent, plutôt que de démarrer avec un secret vide.
#
# USAGE (depuis la racine de bos-light-mvp) :
#   cp .env.example .env   # puis éditer les mots de passe
#   docker compose -f docker-compose.fusion.yml up -d --build

services:
  # ---------------------------------------------------------------------------
  # BOS Light — BDD Identity (Keycloak)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bos_postgres
    restart: always
    # POSTGRES_PASSWORD_FILE : support natif de l'image officielle postgres
    # (lit le mot de passe depuis un fichier plutôt qu'une variable
    # d'environnement en clair, invisible via `docker inspect`).
    secrets:
      - postgres_password
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bos_db}
      POSTGRES_USER: ${POSTGRES_USER:-bos_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fusion_network

  # ---------------------------------------------------------------------------
  # BOS Light — BDD métier applicative
  # ---------------------------------------------------------------------------
  postgres-app:
    image: postgres:16-alpine
    container_name: bos_postgres_app
    restart: always
    secrets:
      - postgres_app_password
    environment:
      POSTGRES_DB: ${POSTGRES_APP_DB:-bos_app_db}
      POSTGRES_USER: ${POSTGRES_APP_USER:-bos_app_user}
      # Voir le commentaire sur le service `postgres` ci-dessus -- même
      # conflit avec la clé héritée de docker-compose.yml (base).
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_app_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    networks:
      - fusion_network

  # ---------------------------------------------------------------------------
  # BOS Light — IAM (Keycloak)
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: bos_keycloak
    restart: always
    # --import-realm : importe automatiquement au démarrage tout realm JSON
    # trouvé dans /opt/keycloak/data/import/ -- SANS EFFET si le realm existe
    # déjà en base (donc sans risque sur une instance qui tourne déjà). C'est
    # ce qui permet à une machine neuve (ex: celle du collègue) de récupérer
    # automatiquement bos-realm (rôles + utilisateurs de test) au premier
    # démarrage, sans reconfiguration manuelle de Keycloak.
    command: start-dev --import-realm
    # Docker secrets NON appliqué ici, volontairement : testé, Keycloak 24
    # rejette KC_DB_PASSWORD_FILE ("no password was provided" -- le support
    # `_FILE` annoncé pour Quarkus ne couvre pas cette variable sur cette
    # version). Retour à la variable d'environnement classique, fail-closed
    # (${...:?...}) -- même limitation que le service `nats` plus bas.
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bos_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-bos_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Définir KEYCLOAK_ADMIN_PASSWORD dans .env}
    volumes:
      - ./keycloak/bos-realm-export.json:/opt/keycloak/data/import/bos-realm-export.json:ro
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - fusion_network

  # ---------------------------------------------------------------------------
  # BOS Light — API Gateway (point d'entrée public unique côté backend)
  # ---------------------------------------------------------------------------
  api-gateway:
    build: ./api-gateway
    # APP_VERSION vaut "dev" par défaut : usage local inchangé. Le positionner
    # (ex: sur le hash court du commit) avant un build donne à l'image un tag
    # unique, qui ne sera plus jamais écrasé silencieusement par le build
    # suivant -- condition nécessaire à tout retour en arrière. Voir ROLLBACK.md.
    image: ghcr.io/devoptim-bos/bos-light-api-gateway:${APP_VERSION:-dev}
    container_name: bos_api_gateway
    restart: always
    ports:
      - "8000:8000"
    # DATABASE_URL retiré : embarquer le mot de passe DANS l'URL le rendait
    # visible en clair sur CETTE variable via `docker inspect`, même avec un
    # secret Docker ailleurs. database.py reconstruit l'URL à partir des
    # parties + POSTGRES_APP_PASSWORD (lu via secrets_util.read_secret,
    # fichier de secret en priorité) -- voir api-gateway/database.py.
    secrets:
      - postgres_app_password
      - nats_password
    environment:
      # `null` : retire la clé DATABASE_URL héritée de docker-compose.yml
      # (base, mot de passe en clair dans l'URL) -- sinon database.py la
      # trouverait via os.getenv("DATABASE_URL") et l'utiliserait EN
      # PRIORITÉ (c'est l'échappatoire voulue), ignorant silencieusement
      # toute la reconstruction sécurisée ci-dessous. Même mécanisme de
      # fusion par clé que POSTGRES_PASSWORD sur le service `postgres`.
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-bos_app_user}
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/postgres_app_password
      POSTGRES_APP_HOST: postgres-app
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-bos_app_db}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/bos-realm
      KEYCLOAK_EXTERNAL_URL: http://localhost:8080/realms/bos-realm
      BIM_API_INTERNAL_URL: http://bim_api:8000
      TIMESERIES_API_INTERNAL_URL: http://timeseries_api:8001
      # Pont NATS->WebSocket (nats_bridge.py) pour le rafraîchissement temps
      # réel des popups de télémétrie -- mêmes identifiants que bim_api/
      # timeseries_api, la gateway n'écrit rien, elle écoute seulement.
      NATS_URL: nats://nats:4222
      NATS_USER: ${NATS_USER:-bos_admin}
      NATS_PASSWORD_FILE: /run/secrets/nats_password
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_SERVICE_NAME: bos-api-gateway
    depends_on:
      - keycloak
      - postgres
      - postgres-app
      - bim_api
      - timeseries_api
      - nats
    networks:
      - fusion_network

  # ---------------------------------------------------------------------------
  # BOS Light — Frontend (React / Vite), seul front actif du produit fusionné
  # ---------------------------------------------------------------------------
  frontend:
    build: ./web-app-configuration/frontend
    # Voir le commentaire sur api-gateway : même schéma de tag de version.
    image: ghcr.io/devoptim-bos/bos-light-frontend:${APP_VERSION:-dev}
    container_name: bos_frontend
    restart: always
    environment:
      # Le navigateur (pas le conteneur) contacte Keycloak/l'API Gateway
      # directement : les URLs doivent être celles vues depuis l'hôte, pas les
      # noms de service Docker. Sans ces variables, keycloak-js part avec des
      # valeurs undefined et construit une URL de login invalide.
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: bos-realm
      VITE_KEYCLOAK_CLIENT_ID: web-app-frontend
      VITE_API_GATEWAY_URL: http://localhost:8000
      VITE_GRAFANA_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
    networks:
      - fusion_network

  # ---------------------------------------------------------------------------
  # BOS Light — Frontend Client / BOS Exécution (React / Vite)
  # Deuxième frontend, partageant la même API Gateway/Keycloak que le
  # Configurateur ci-dessus -- voir security.py (EXECUTION_ALLOWED_ROLES) et
  # la route /api/execution-access dans api-gateway/main.py.
  # ---------------------------------------------------------------------------
  frontend-client:
    build: ./web-app-execution/frontend-client
    image: ghcr.io/devoptim-bos/bos-light-frontend-client:${APP_VERSION:-dev}
    container_name: bos_frontend_client
    restart: always
    environment:
      # Même raisonnement que le service "frontend" ci-dessus : client Keycloak
      # dedie (web-app-client) et port hote 5174.
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: bos-realm
      VITE_KEYCLOAK_CLIENT_ID: web-app-client
      VITE_API_GATEWAY_URL: http://localhost:8000
      # Widget "Consommation électrique" (popup historique Grafana, iframe
      # kiosk) -- même raisonnement que le service "frontend" : le navigateur
      # contacte Grafana directement, pas via l'API Gateway.
      VITE_GRAFANA_URL: http://localhost:3000
    ports:
      - "5174:5173"
    depends_on:
      - api-gateway
    networks:
      - fusion_network

  # ---------------------------------------------------------------------------
  # MVP BIM — ArcadeDB (graphe BIM + moteur time-series natif)
  # ---------------------------------------------------------------------------
  arcadedb:
    # Épinglé par digest (pas par tag) : la version en cours d'exécution est un
    # build de développement (26.9.1-SNAPSHOT) sans tag numéroté stable qui lui
    # corresponde -- seul le digest garantit de retomber exactement sur ces
    # mêmes bits en cas de reconstruction. Voir ROLLBACK.md pour la procédure
    # de montée de version.
    image: arcadedata/arcadedb@sha256:76fa9c113e85795c760820cad4fc5287973fc9d006074d286986984cdcb94eb5
    container_name: bos_arcadedb
    restart: always
    environment:
      - JAVA_OPTS=-Darcadedb.server.rootPassword=${ARCADEDB_PASSWORD:?Définir ARCADEDB_PASSWORD dans .env} -Darcadedb.server.plugins=OpenCypher
      # ARCADEDB_OPTS_MEMORY (variable dédiée du script de démarrage de
      # l'image, appliquée APRÈS JAVA_OPTS donc prioritaire dessus) : sans
      # elle, la JVM se limite par défaut à ~25% de la RAM du conteneur
      # qu'elle détecte AU DÉMARRAGE (visible comme "MAXRAM=2.00GB" dans les
      # logs) -- une maquette volumineuse (ex: ~20 000 équipements dans une
      # même zone) peut alors provoquer un OutOfMemoryError: Java heap space
      # Redescendu de 6G à 4G (20/09) : sur la machine bare-metal actuelle
      # (15 Go RAM total, PAS du Docker Desktop avec VM dédiée comme le
      # contexte du commentaire précédent), un plafond à 6G ne laissait plus
      # assez de marge à l'hôte -- crash en boucle d'ArcadeDB observé
      # (restartCount 0->8 en quelques minutes) pendant le chargement d'une
      # maquette clinic (ARCHI+HVAC+ELEC+MEP) dans le navigateur (ThatOpen),
      # avec le swap déjà à moitié plein. ATTENTION : un vrai
      # "OutOfMemoryError: Java heap space" avait justifié la hausse à 6G
      # avant ça (zone à ~6000 équipements + historique simulé) -- si ce cas
      # se represente avec 4G, remonter le plafond ET réduire le volume de
      # données de test accumulées (voir DELETE /graph/zone) plutôt que de
      # remonter indéfiniment le plafond sans jamais nettoyer.
      - ARCADEDB_OPTS_MEMORY=-Xms1G -Xmx4G
    volumes:
      # Sans ceci, chaque recréation du conteneur (rebuild, redémarrage machine)
      # repartait d'une base vide : les maquettes déjà ingérées disparaissaient.
      - arcadedb_data:/home/arcadedb/databases
    ports:
      # Admin/debug uniquement : lié à 127.0.0.1, pas au reste du réseau.
      - "127.0.0.1:8582:8582"
      - "127.0.0.1:2480:2480"
      - "127.0.0.1:2424:2424"
    networks:
      - fusion_network

  # ---------------------------------------------------------------------------
  # MVP BIM — NATS JetStream (canal d'ingestion live/historique)
  # ---------------------------------------------------------------------------
  nats:
    # Épinglé par digest (= v2.14.5 au moment de l'écriture). Voir ROLLBACK.md
    # pour la procédure de montée de version.
    image: nats@sha256:026a66a4497c6d7d3eed741781770099c48c755bf3a55b6950d76dd210596eb3
    container_name: bos_nats
    restart: always
    # Docker secrets NON appliqué ici, volontairement : cette image officielle
    # n'embarque AUCUN shell (`/bin/sh` absent -- vérifié, le conteneur refuse
    # de démarrer avec un entrypoint shell), donc pas moyen d'y lire un
    # fichier de secret au démarrage sans changer d'image de base. Le mot de
    # passe reste en variable d'environnement fail-closed (${...:?...}) --
    # seul le réseau Docker interne y a accès, pas de port NATS exposé hors
    # du port applicatif 4222 nécessaire aux autres services.
    command: "-js -m 8222 --user ${NATS_USER:-bos_admin} --pass ${NATS_PASSWORD:?Définir NATS_PASSWORD dans .env}"
    ports:
      - "4222:4222"
      # Monitoring uniquement : lié à 127.0.0.1.
      - "127.0.0.1:8222:8222"
    networks:
      - fusion_network

  # ---------------------------------------------------------------------------
  # MVP BIM — SeaweedFS (stockage objet des maquettes IFC validées)
  # ---------------------------------------------------------------------------
  seaweedfs:
    # Épinglé par digest (= 4.42 au moment de l'écriture). Voir ROLLBACK.md
    # pour la procédure de montée de version.
    image: chrislusf/seaweedfs@sha256:f7cbc8bdbbf60a1aaba7d61784a3bdff3ec1e0657f6ad0b26d5b6ab2cd9d0dc6
    container_name: bos_seaweedfs
    restart: always
    command: 'server -dir=/data -volume.max=5'
    ports:
      # Master (API/UI) admin/debug uniquement, lié à 127.0.0.1. Le port Volume
      # HTTP (8080) n'est PAS publié : (1) il entrait en conflit avec le port
      # hôte 8080 de Keycloak, (2) le code applicatif ne l'adresse que via le
      # réseau Docker interne (URLs retournées par le master), jamais depuis
      # l'hôte.
      - "127.0.0.1:9333:9333"
    networks:
      - fusion_network

  # ---------------------------------------------------------------------------
  # MVP BIM — API de validation/ingestion IFC (interne uniquement, via gateway)
  # ---------------------------------------------------------------------------
  bim_api:
    build: ./bim_validator
    # Voir le commentaire sur api-gateway : même schéma de tag de version.
    # bim_api et timeseries_api partagent le même contexte de build
    # (./bim_validator) mais restent deux images distinctes (entrypoints
    # différents) : chacune garde son propre nom d'image.
    image: ghcr.io/devoptim-bos/bos-light-bim-api:${APP_VERSION:-dev}
    container_name: bos_bim_api
    restart: always
    depends_on:
      - arcadedb
      - seaweedfs
      - nats
      - grafana
    # _FILE : lu par infrastructure/secrets.py:read_secret() (bim_validator),
    # pas un support natif de l'image ici -- c'est du code applicatif à nous.
    secrets:
      - arcadedb_password
      - nats_password
      - grafana_admin_password
    environment:
      - SEAWEEDFS_MASTER_URL=http://seaweedfs:9333
      - ARCADEDB_BASE_URL=http://arcadedb:2480
      - ARCADEDB_DATABASE=bim
      - ARCADEDB_USERNAME=root
      - ARCADEDB_PASSWORD_FILE=/run/secrets/arcadedb_password
      - NATS_URL=nats://nats:4222
      - NATS_USER=${NATS_USER:-bos_admin}
      - NATS_PASSWORD_FILE=/run/secrets/nats_password
      # bim_api parle à Grafana via le réseau Docker interne (nom de service),
      # contrairement au frontend qui le contacte depuis le navigateur via
      # localhost:3000 -- ne pas confondre les deux URLs.
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_ADMIN_USER=admin
      - GRAFANA_ADMIN_PASSWORD_FILE=/run/secrets/grafana_admin_password
    # Pas de "ports:" : uniquement joignable via le réseau Docker interne
    # (résolution DNS "bim_api"), donc uniquement via l'API Gateway.
    entrypoint: ["python", "api_server.py"]
    volumes:
      # Fichier de démonstration "consommation en direct" (voir
      # publish_values_file.py, lancé avec `docker exec bos_bim_api ...`) :
      # lecture seule, un simple redémarrage du conteneur n'est même pas
      # nécessaire pour voir un nouveau contenu, le script relit le fichier
      # à chaque lancement.
      - ./live:/app/live:ro
    networks:
      - fusion_network

  # ---------------------------------------------------------------------------
  # MVP BIM — API TimeSeries (interne uniquement, via gateway)
  # ---------------------------------------------------------------------------
  timeseries_api:
    build: ./bim_validator
    # Voir le commentaire sur bim_api : même contexte de build, image distincte.
    image: ghcr.io/devoptim-bos/bos-light-timeseries-api:${APP_VERSION:-dev}
    container_name: bos_timeseries_api
    restart: always
    depends_on:
      - arcadedb
      - nats
    secrets:
      - arcadedb_password
      - nats_password
    environment:
      - ARCADEDB_BASE_URL=http://arcadedb:2480
      - ARCADEDB_DATABASE=bim
      - ARCADEDB_USERNAME=root
      - ARCADEDB_PASSWORD_FILE=/run/secrets/arcadedb_password
      - NATS_URL=nats://nats:4222
      - NATS_USER=${NATS_USER:-bos_admin}
      - NATS_PASSWORD_FILE=/run/secrets/nats_password
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - OTEL_EXPORTER_OTLP_INSECURE=${OTEL_EXPORTER_OTLP_INSECURE:-true}
      - OTEL_SERVICE_NAME=bos-timeseries-api
    # Pas de "ports:" : idem bim_api, joignable uniquement via le réseau interne.
    entrypoint: ["uvicorn", "timeseries_api:app", "--host", "0.0.0.0", "--port", "8001"]
    networks:
      - fusion_network

  # ---------------------------------------------------------------------------
  # MVP BIM — CLI de validation IFC one-shot (pas de service continu)
  # Usage ponctuel : docker compose -f docker-compose.fusion.yml run --rm bim_validator archi:maquettes/xxx.ifc
  # ---------------------------------------------------------------------------
  bim_validator:
    build: ./bim_validator
    # Voir le commentaire sur bim_api : même contexte de build, image distincte.
    image: ghcr.io/devoptim-bos/bos-light-bim-validator:${APP_VERSION:-dev}
    container_name: bos_bim_validator
    profiles: ["tools"]
    secrets:
      - arcadedb_password
      - nats_password
    environment:
      - SEAWEEDFS_MASTER_URL=http://seaweedfs:9333
      - ARCADEDB_BASE_URL=http://arcadedb:2480
      - ARCADEDB_DATABASE=bim
      - ARCADEDB_USERNAME=root
      - ARCADEDB_PASSWORD_FILE=/run/secrets/arcadedb_password
      - NATS_URL=nats://nats:4222
      - NATS_USER=${NATS_USER:-bos_admin}
      - NATS_PASSWORD_FILE=/run/secrets/nats_password
    volumes:
      - ./bim_validator/maquettes:/app/maquettes
    networks:
      - fusion_network

  # ---------------------------------------------------------------------------
  # MVP BIM — Grafana (cockpits time-series, embarqué dans le frontend BOS
  # Light en mode kiosk : le client voit des graphiques, pas "Grafana"). La
  # datasource Infinity interroge ArcadeDB directement via ses endpoints
  # /api/v1/ts/{db}/grafana/* (compatibles DataFrame Grafana nativement, pas
  # besoin de passer par l'API Gateway) avec l'utilisateur ArcadeDB dédié
  # "grafana" (lecture seule, cf. ArcadeDB server-users).
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # pgAdmin -- OUTIL de consultation des bases Postgres (optionnel).
  # Non démarré par défaut (profil "tools") : `docker compose -f
  # docker-compose.fusion.yml --profile tools up -d pgadmin`, puis
  # http://localhost:5050. Lié à 127.0.0.1 uniquement. Connexion :
  # admin@admin.com + le contenu de secrets/postgres_app_password.txt (aucun
  # mot de passe en clair dans ce fichier). Les deux serveurs Postgres sont
  # préenregistrés (pgadmin/servers.json) : pgAdmin demande leur mot de passe
  # (secrets/postgres_app_password.txt et secrets/postgres_password.txt) à la
  # première ouverture.
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bos_pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    secrets:
      - postgres_app_password
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/postgres_app_password
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
      - postgres-app
    networks:
      - fusion_network

  grafana:
    image: grafana/grafana-oss:latest
    container_name: bos_grafana
    restart: always
    # GF_SECURITY_ADMIN_PASSWORD__FILE : Grafana supporte nativement le
    # suffixe `__FILE` (double underscore, sa convention à lui) sur N'IMPORTE
    # QUELLE variable GF_* -- même bénéfice que POSTGRES_PASSWORD_FILE.
    secrets:
      - grafana_admin_password
    environment:
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      # Sans ça, Grafana refuse d'être chargé dans un <iframe> (en-tête
      # X-Frame-Options par défaut) -- indispensable pour l'embed kiosk.
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # Accès anonyme en lecture seule (rôle Viewer) : la page qui embarque
      # l'iframe est déjà derrière l'auth Keycloak du frontend BOS Light, pas
      # besoin d'un second login Grafana par-dessus pour le client final.
      # Grafana lui-même n'est pas exposé publiquement (cf. "ports" ci-dessous).
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      # Datasource + dashboard "BOS Light - Equipement (demo)" provisionnés depuis
      # le dépôt : sans ça, une machine neuve (ex: celle du tuteur) affiche
      # "Dashboard not found" dans l'onglet Supervision (le dashboard n'existait
      # que dans le volume grafana_data de la machine d'origine).
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Comme Keycloak : le navigateur doit atteindre Grafana directement pour
      # afficher l'iframe (contrairement à ArcadeDB Studio/NATS monitoring,
      # qui sont debug-only et donc lies a 127.0.0.1).
      - "3000:3000"
    depends_on:
      - arcadedb
    networks:
      - fusion_network

  # Jaeger reçoit les traces OTLP des services backend et expose son interface
  # de recherche uniquement sur la machine hôte.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: bos_jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
    networks:
      - fusion_network

  # Serveur MCP en lecture seule : permet à un agent compatible MCP
  # d'interroger Jaeger sans accéder aux autres services.
  observability-mcp:
    build: ./observability-mcp
    container_name: bos_observability_mcp
    restart: unless-stopped
    environment:
      JAEGER_URL: http://jaeger:16686
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - jaeger
    networks:
      - fusion_network

networks:
  fusion_network:
    driver: bridge

volumes:
  postgres_data:
  postgres_app_data:
  arcadedb_data:
  grafana_data:
  pgadmin_data:

# -----------------------------------------------------------------------------
# SECRETS DOCKER -- un fichier en clair par mot de passe (jamais committé,
# voir .gitignore et secrets/README.md), monté en lecture seule dans les
# conteneurs à /run/secrets/<nom> au lieu de passer par une variable
# d'environnement classique (visible en clair via `docker inspect`).
# Premier démarrage : copier chaque secrets/*.txt.example vers *.txt (sans
# l'extension .example) et y mettre de vrais mots de passe.
# -----------------------------------------------------------------------------
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  postgres_app_password:
    file: ./secrets/postgres_app_password.txt
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password.txt
  arcadedb_password:
    file: ./secrets/arcadedb_password.txt
  nats_password:
    file: ./secrets/nats_password.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
